<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Finder</title>
    <!-- BARIS 8: MEMANGGIL STYLE.CSS DENGAN BENAR -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="container">
        <!-- Struktur pencarian Anda (Form, input username, tombol cari) -->
        <div class="search-card">
            <h1>GitHub Profile Finder</h1>
            <p>Cari profil pengguna GitHub dengan memasukkan username mereka.</p>
            <form id="searchForm">
                <input type="text" id="username" placeholder="Contoh: octocat">
                <button type="submit" id="searchButton">Cari Profil</button>
            </form>
            <div id="statusMessage"></div>
        </div>

        <section id="result"></section>

        <!-- KODE ERROR 404 KUSTOM YANG DIBAWAH SECTION -->
        <div id="error404-container" style="display: none; text-align: center; padding: 60px 20px;">
            <h1 style="font-size: 120px; margin: 0; color: #dc3545; font-weight: bold; line-height: 1;">404</h1>
            <h2 style="font-size: 28px; margin: 15px 0 5px 0; color: #333; font-weight: 600;">User Tidak Ditemukan</h2>
            <p style="color: #666; margin-bottom: 25px; font-size: 16px;">Periksa kembali username GitHub yang Anda masukkan.</p>
            <button id="btn-kembali" style="padding: 12px 28px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold;">Cari Lagi</button>
        </div>
    </main>

    <footer>
        <p>Data profil diambil dari GitHub Public API.</p>
    </footer>

    <!-- MEMANGGIL SCRIPT.JS DENGAN BENAR -->
    <script src="script.js"></script>
</body>
</html>
